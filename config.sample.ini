[paths]
# ── REQUIRED ────────────────────────────────────────────────────────────────
# Full path to DolphinTool.exe
# Windows example: C:\Dolphin\DolphinTool.exe
# Example with a standard installation: C:\Program Files\Dolphin\DolphinTool.exe
dolphin_tool = C:\Program Files\Dolphin\DolphinTool.exe

# Full path to wit.exe (Wiimms ISO Tools)
# Required for WBFS <-> ISO conversions and for WBFS <-> RVZ workflows
# Download: https://wit.wiimm.de/
wit_tool = C:\Program Files\Wiimm\WIT\wit.exe

[output]
# Output folder for RVZ files (relative to the .exe/script, or absolute)
output_rvz = .\RVZ

# Output folder for WBFS files (relative to the .exe/script, or absolute)
output_wbfs = D:\Wii\wbfs

[conversion]
# RVZ compression: none | zstd | bzip2 | lzma | lzma2
rvz_compression = zstd

# Compression level: zstd 1-22, others 1-9
rvz_compression_level = 5

[batch]
# Batch mode (iso_to_wbfs.bat or: convert.py --batch --to wbfs)
# Folder that contains the .iso files to convert
input_iso = D:\Wii\ISO

# Folder where the .wbfs files are written
output_wbfs = D:\Wii\wbfs
