[paths]
# ── OPTIONAL ────────────────────────────────────────────────────────────────
# Leave empty to auto-detect. Tools are searched next to the script, in
# .\tools\, on the PATH and in the usual install folders.
#
# Full path to DolphinTool.exe (only needed for RVZ conversions)
# Example: C:\Program Files\Dolphin\DolphinTool.exe
dolphin_tool =

# Full path to wit.exe (Wiimms ISO Tools, needed for WBFS)
# If it cannot be found it is downloaded automatically into .\tools\wit\
# Example: C:\WiimmsISOTools\bin\wit.exe
wit_tool =

# NKit 2 command line tool (nkit.exe). Only needed for NKit images (*.nkit.iso),
# which wit cannot read. Downloaded automatically into .\tools\nkit\ if missing.
# Example: C:\NKit\nkit.exe
nkit_tool =

[output]
# Output folder for RVZ files (relative to the .exe/script, or absolute)
output_rvz = .\RVZ

# Output folder for WBFS files (relative to the .exe/script, or absolute)
output_wbfs = D:\Wii\wbfs

[conversion]
# RVZ compression: none | zstd | bzip2 | lzma | lzma2
rvz_compression = zstd

# Compression level: zstd 1-22, others 1-9
rvz_compression_level = 5

[batch]
# Batch mode: these are the folders iso_to_wbfs.bat uses (or: convert.py --batch --to wbfs)
# Folder that contains the .iso files to convert (sub-folders are included)
input_iso = D:\Wii\ISO

# Folder where the .wbfs files are written. Overrides [output] output_wbfs in batch mode.
output_wbfs = D:\Wii\wbfs

# Output file name (without extension). Placeholders:
#   {name}  = the ISO file name      {id} = 6-character game ID (e.g. RMGE01)
#   {title} = disc title from the ISO header
# "{name} [{id}]" is the naming Wii USB loaders (USB Loader GX, WiiFlow, CFG) recognise.
# If the ISO name already contains the game ID it is kept as-is.
name_format = {name} [{id}]

# How NKit images (*.nkit.iso) are converted:
#   wbfs = NKit writes the WBFS directly (fast, no temporary file)
#   iso  = NKit restores the full ISO first, then wit turns it into WBFS
# If "wbfs" fails for a game, "iso" is tried automatically for that game.
nkit_mode = wbfs
